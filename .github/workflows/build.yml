name: build
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.14.1
      - name: Native regression tests
        run: |
          zig cc -std=c99 -Wall -Wextra -Werror -O2 -DTEST_MAIN src/tetris.c -o tetris_test
          ./tetris_test
      - name: Build WebAssembly
        run: |
          zig cc -std=c99 -O2 -Wall -Wextra -Werror -target wasm32-freestanding -nostdlib \
            -Wl,--no-entry -Wl,--export-dynamic -Wl,--export-memory \
            -Wl,--initial-memory=2097152 -Wl,--max-memory=2097152 \
            src/tetris.c -o rebuilt.wasm
      - name: Reproducible build check
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          sha256sum web/tetris.wasm rebuilt.wasm >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cmp web/tetris.wasm rebuilt.wasm
      - name: Upload wasm artifact
        uses: actions/upload-artifact@v4
        with:
          name: tetris-wasm
          path: web/tetris.wasm
      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: web
  pages:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
