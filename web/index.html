<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8">
<title>FRETRIS — Free/Libre Tetris in C + WebAssembly (AGPL-3.0)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --edge: #2a2740; --ink: #d7d7ea; }
  html, body {
    margin: 0; min-height: 100%;
    font-family: system-ui, "Segoe UI", sans-serif;
    color: var(--ink);
    background: #0c0b14;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 16px;
    -webkit-user-select: none; user-select: none;
  }
  h1 {
    font-size: 18px; font-weight: 600; letter-spacing: 8px; margin: 0;
    color: var(--ink); text-transform: uppercase;
  }
  canvas {
    image-rendering: pixelated;
    width: min(94vw, 460px);
    border: 1px solid var(--edge);
    border-radius: 6px;
    background: #000;
  }
  .pad {
    display: grid; gap: 8px;
    grid-template-columns: repeat(4, 64px);
    touch-action: none;
  }
  .pad button {
    height: 52px; font-size: 18px; line-height: 1;
    color: var(--ink); background: #16141f;
    border: 1px solid var(--edge); border-radius: 8px;
    cursor: pointer; touch-action: none;
  }
  .pad button:active { background: #26233a; }
  .pad .w2 { grid-column: span 2; }
  footer {
    font-size: 12px; text-align: center; line-height: 1.9; max-width: 480px;
    color: #8b8aa3;
  }
  a { color: #7aa2ff; text-decoration: none; }
  a:hover { text-decoration: underline; }
  @media (hover: hover) and (pointer: fine) { .pad { display: none; } }
</style>
</head>
<body>
  <h1>Fretris</h1>
  <canvas id="screen" width="480" height="400"></canvas>
  <div class="pad" aria-label="controls">
    <button data-key="0">&#9664;</button>
    <button data-key="1">&#9654;</button>
    <button data-key="2">&#9660;</button>
    <button data-key="3" data-tap>&#8635;</button>
    <button data-key="5" data-tap>HOLD</button>
    <button data-key="6" data-tap class="w2">DROP</button>
    <button data-key="8" data-tap class="w2">START</button>
    <button data-key="7" data-tap>II</button>
    <button data-key="9" data-tap>RST</button>
  </div>
  <footer>
    Keys: &larr; &rarr; move &middot; &uarr;/Z rotate &middot; &darr; soft &middot; space hard &middot;
    C hold &middot; P pause &middot; R restart &middot; M music<br>
    Rules: Tetris Guideline (SRS, 7-bag) &middot; engine: freestanding C
    &rarr; WebAssembly<br>
    <a href="https://github.com/moon440/fretris">github.com/moon440/fretris</a>
    &middot; AGPL-3.0-only &middot; independent fan project; Tetris is a trademark of the Tetris Company.
</footer>
  <script src="glue.js?v=4"></script>
</body>
</html>
